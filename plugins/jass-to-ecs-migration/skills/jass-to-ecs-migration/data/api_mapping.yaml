# JASS API → Lua/ac API Migration Mapping
# Used by extract_trigger.py to recommend API replacements

# --- 单位相关 ---
- jass_api: "GetTriggerUnit()"
  category: "unit_event"
  lua_alternative:
    ecs_context: "event.trigger_unit (在 ECS 事件回调中)"
    jass_callback: "GetTriggerUnit() (JASS 回调中仍可用)"
  notes: "在 ECS 事件回调中优先使用 event 对象的属性"

- jass_api: "GetDyingUnit()"
  category: "unit_event"
  lua_alternative:
    ecs_context: "event.dying_unit"
    jass_callback: "GetDyingUnit()"

- jass_api: "GetAttacker()"
  category: "unit_event"
  lua_alternative:
    ecs_context: "event.attacker"

- jass_api: "GetEnumUnit()"
  category: "unit_enum"
  lua_alternative:
    ecs_context: "for _, entity in query do local unit = entity.unit"
  notes: "ECS 不使用 ForGroup 枚举，改为遍历查询结果"

- jass_api: "GetUnitX(unit)"
  category: "unit_info"
  lua_alternative:
    preferred: "unit.posComp.x (如果单位有 PosComp)"
    fallback: "GetUnitX(unit)"

- jass_api: "GetUnitY(unit)"
  category: "unit_info"
  lua_alternative:
    preferred: "unit.posComp.y (如果单位有 PosComp)"
    fallback: "GetUnitY(unit)"

- jass_api: "GetUnitTypeId(unit)"
  category: "unit_info"
  lua_alternative:
    preferred: "unit.unitIdComp.type_id"
    fallback: "GetUnitTypeId(unit)"

- jass_api: "GetWidgetLife(unit)"
  category: "unit_info"
  lua_alternative:
    preferred: "unit.healthComp.current"
    fallback: "GetWidgetLife(unit)"
  notes: "null 安全: unit ~= nil and GetWidgetLife(unit) > 0.405"

# --- 定时器 ---
- jass_api: "CreateTimer()"
  category: "timer"
  lua_alternative:
    preferred: "ac.timer(callback, timeout, {loop = false})"
  notes: "不再手动创建 timer 对象"

- jass_api: "TimerStart(timer, timeout, periodic, callback)"
  category: "timer"
  lua_alternative:
    preferred: "ac.timer(callback, timeout, {loop = periodic})"

- jass_api: "PauseTimer(timer)"
  category: "timer"
  lua_alternative:
    preferred: "timer_handle:stop() (ac.timer 返回的对象)"

- jass_api: "DestroyTimer(timer)"
  category: "timer"
  lua_alternative:
    preferred: "N/A (ac.timer 自动管理生命周期)"

