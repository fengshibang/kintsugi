[project]
name = "video-idea-extractor"
version = "0.1.0"
description = "用 qwen3.7-plus 多模态模型自适应提取视频中的点子创意"
requires-python = ">=3.13"
dependencies = ["openai>=1.50"]

[project.scripts]
vie = "video_idea_extractor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
